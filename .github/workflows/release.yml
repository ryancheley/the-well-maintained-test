name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.x"
    - name: Install build dependencies
      run: python -m pip install --upgrade pip build
    - name: Build distributions
      run: python -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7.0.2
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 90

  test:
    name: Test package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false
    - name: Install dependencies
      run: uv sync --extra test
    - name: Run tests
      run: uv run pytest

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
    - build
    - test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/the-well-maintained-test
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check if tag is on main branch
      run: |
        # Fetch main branch to check if tag is on it
        git fetch origin main:main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "Tag $GITHUB_REF_NAME is not on main branch. Skipping PyPI publish."
          exit 1
        fi
        echo "Tag $GITHUB_REF_NAME is on main branch. Proceeding with PyPI publish."
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: Create Github Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        "$GITHUB_REF_NAME" dist/**
        --repo "$GITHUB_REPOSITORY"

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs:
    - build
    - test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/the-well-maintained-test
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
